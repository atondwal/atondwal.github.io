<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registry - Anish & Elizabeth</title>
    <style>
        :root {
            --main-color: #5d5d5d;
            --accent-color: #e0e0e0;
            --background-color: #ffffff;
            --font-family: 'Cormorant Garamond', Georgia, serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-family);
            color: var(--main-color);
            background-color: var(--background-color);
            line-height: 1.6;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0;
            scroll-behavior: smooth;
        }
        
        .navigation-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: var(--background-color);
            border-bottom: 1px solid var(--accent-color);
            z-index: 1000;
            padding: 20px 0;
        }
        
        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            gap: 60px;
        }
        
        .nav-link {
            color: var(--main-color);
            text-decoration: none;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            transition: opacity 0.3s ease;
        }
        
        .nav-link:hover {
            opacity: 0.6;
        }

        .nav-dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--background-color);
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.1);
            border: 1px solid var(--accent-color);
            z-index: 1;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding-top: 10px;
        }

        .dropdown-content a {
            color: var(--main-color);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        .dropdown-content a:hover {
            background-color: var(--accent-color);
        }

        .nav-dropdown:hover .dropdown-content {
            display: block;
        }

        .content-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .nav-container {
                gap: 30px;
                flex-wrap: wrap;
            }
            
            .nav-link {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation bar -->
    <nav class="navigation-bar">
        <div class="nav-container">
            <a href="/elizabeth" class="nav-link">Weekend Details</a>
            <a href="https://withjoy.com/elizabeth-and-anish/rsvp" class="nav-link">RSVP</a>
            <div class="nav-dropdown">
                <a href="#" class="nav-link" onclick="return false;">Registry</a>
                <div class="dropdown-content">
                    <a href="https://www.amazon.com/wedding/registry/2V517CP7D2JFX" target="_blank">Amazon</a>
                    <a href="https://withjoy.com/elizabeth-and-anish/registry" target="_blank">WithJoy</a>
                </div>
            </div>
            <a href="visiting-monterey.html" class="nav-link">Visiting Monterey County</a>
        </div>
    </nav>
    
    <div class="content-container">
        <h1>Coming soon</h1>
    </div>
</body>
</html>
